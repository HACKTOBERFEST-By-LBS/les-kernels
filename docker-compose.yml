services:
  openwa:
    image: openwa/wa-automate:latest
    init: true
    restart: unless-stopped
    shm_size: "1gb"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      WA_IN_DOCKER: "true"
      WA_HEADLESS: "true"
      WA_AUTH_TIMEOUT: "0"
      WA_QR_TIMEOUT: "0"
      WA_PORT: "8080"
      WA_HOST: "0.0.0.0"
      WA_EXECUTABLE_PATH: /usr/bin/google-chrome
      WA_SESSION_ID: alerte
      WA_USER_DATA_DIR: /sessions/alerte
      WA_API_KEY: ${WA_API_KEY:-hackathon-dev-key}
      OPEN_WA_WEBHOOK_SECRET: ${OPEN_WA_WEBHOOK_SECRET:-hackathon-local-secret}
      OPENWA_WEBHOOK_URL: http://host.docker.internal:3000/api/webhooks/openwa
    volumes:
      - ./sessions:/sessions
      - ./openwa/wa.config.mjs:/openwa/wa.config.mjs:ro
      - ./openwa/docker-start.sh:/openwa/docker-start.sh:ro
    entrypoint: ["/usr/bin/dumb-init", "--", "bash", "/openwa/docker-start.sh"]
